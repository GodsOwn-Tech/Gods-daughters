<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Rooted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;0,600;1,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  (function () {
    var saved = localStorage.getItem("rooted_theme");
    if (saved === "dark") document.documentElement.setAttribute("data-theme", "dark");
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="logo">rooted</a>
  <ul class="navlinks">
    <li><a href="devotionals.html">📖 Devotionals</a></li>
    <li><a href="bible-study.html">📚 Bible Study</a></li>
    <li><a href="mood-help.html">💛 Mood Help</a></li>
    <li><a href="prayer-wall.html">🙏 Prayer Wall</a></li>
    <li><a href="gist.html">💬 The Gist</a></li>
    <li><a href="friends.html">👥 Friends</a></li>
    <li id="nav-auth"></li>
    <li class="notif-wrap"><button class="notif-bell" id="notif-bell" title="Notifications">🔔<span class="notif-badge" id="notif-badge" style="display:none;">0</span></button><div class="notif-panel" id="notif-panel" style="display:none;"></div></li>
    <li><button class="theme-toggle" id="theme-toggle" title="Toggle light/dark mode">🌙</button></li>
  </ul>
</nav>

<div class="form-page">
  <h2>Welcome back</h2>
  <p class="sub">Good to see you again.</p>
  <div id="error-box"></div>
  <form id="login-form">
    <div class="field">
      <label>Email or username</label>
      <input type="text" id="identifier" required />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" required />
    </div>
    <button class="btn-primary" type="submit" id="submit-btn">Sign in</button>
  </form>
  <p class="sub" style="margin-top:12px;"><a href="forgot-password.html">Forgot your password?</a></p>
  <p class="sub" style="margin-top:6px;">New here? <a href="signup.html">Create an account</a></p>
</div>

<footer class="site-footer">
  <div class="display">rooted</div>
  <p>a quiet place to grow · made for girls figuring out faith, one honest day at a time</p>
</footer>

<script src="script.js"></script>
</body>
</html>
